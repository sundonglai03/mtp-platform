schema_version: 1

id: API-LOGIN-001
title: 登录接口返回可用 token 且响应时间在阈值内
description: 纯 HTTP 接口用例，不经过浏览器；覆盖状态码、JSON 结构、JSONPath、响应时间四类断言。
module: auth
priority: P1
tags: [smoke, api, login]

environment:
  name: local
  base_url: http://127.0.0.1:8099

secrets:
  login_password: MTP_LOGIN_PASSWORD

variables:
  username: tester
  max_response_ms: 2000

timeout_sec: 60

steps:
  - id: api-login
    action: api.post
    description: 调用登录接口
    args:
      path: /api/login
      json:
        username: "{{ vars.username }}"
        password: "{{ secrets.login_password }}"
    timeout_sec: 15
    retry: 1
    retry_delay_ms: 300
    evidence: [text]

  - id: api-me
    action: api.get
    description: 用 token 查询当前用户
    args:
      path: /api/me
      headers:
        Authorization: "Bearer {{ steps.api-login.json.token }}"
    timeout_sec: 15

assertions:
  - id: login-status
    type: status_code
    actual: "{{ steps.api-login.http_status }}"
    expected: 200
    message: 登录接口应返回 200

  - id: login-response-shape
    type: json_schema
    source: "{{ steps.api-login.json }}"
    args:
      schema:
        type: object
        required: [ok, token, user]
        properties:
          ok:
            const: true
          token:
            type: string
            minLength: 8
          user:
            type: object
            required: [name, role]
    message: 登录响应结构应符合约定

  - id: me-returns-user
    type: json_path
    source: "{{ steps.api-me.json }}"
    args:
      path: "$.user.name"
      expected: "{{ vars.username }}"
    message: 带 token 查询应返回登录用户

  - id: login-fast-enough
    type: response_time
    actual: "{{ steps.api-login.duration_ms }}"
    expected: "{{ vars.max_response_ms }}"
    args:
      mode: lte
    message: 登录接口响应时间应低于阈值

  - id: both-calls-ok
    type: all
    message: 两次调用都应成功
    items:
      - type: equals
        actual: "{{ steps.api-login.ok }}"
        expected: true
      - type: equals
        actual: "{{ steps.api-me.ok }}"
        expected: true
