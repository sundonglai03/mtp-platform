# mtp-platform 配置（仓库版）
#
# 原则：
# - 测试凭证随上传的 JSON 套件传入，平台配置和 tools 不保存凭证；
# - 不写死本机绝对路径（机器相关的值写 ${VAR:-默认}）；
# - 相对路径按「项目根」解析（默认当前工作目录，可用 MTP_ROOT 覆盖）。
#
# 说明：执行链路**不走 MCP**，这里的白名单/限额直接作用于 tools/ 下的直连工具。

security:
  # 内网被测站点普遍是自签证书（例如 https://192.168.10.33）：不开这个开关，
  # chromium 会直接以 ERR_CERT_AUTHORITY_INVALID 失败，浏览器用例第一步就打不开页面。
  # 代码默认关闭；这里是部署侧按需开启。
  playwright_ignore_https_errors: true
  # 走代理的环境里，本地/内网被测目标不应该被代理接管（否则会拿到 502）。
  # loopback 永远绕过；这里再补充内网网段。用例可写 args.use_proxy: true 强制走代理。
  http_no_proxy:
    - "127.0.0.1"
    - "localhost"
    - "::1"
    - "192.168.*"
    - "10.*"
    - "172.16.*"
  # SSH 允许的目标（精确 IP / IPv6 / 域名，支持 fnmatch 通配）；空列表 = 全部拒绝。
  ssh_allow_hosts:
    - "127.0.0.1"
    - "192.168.*"
    - "10.*"
    - "172.16.*"
  # 是否允许用例用 `allow_any_host: true` 自行豁免白名单（默认 false）。
  ssh_allow_any_host: false
  # MySQL 允许的连接主机
  mysql_allow_hosts:
    - "127.0.0.1"
    - "localhost"
    - "192.168.*"
    - "10.*"
    - "172.16.*"
  # 禁止连接的库名（生产库兜底防线）
  mysql_deny_databases:
    - production
    - prod
    - master
  # 单条写 SQL 允许影响的最大行数
  mysql_max_affected_rows: 1000
  # 写操作默认需要用 --allow-write 显式放行
  mysql_require_write_consent: true
  # api 步骤允许上传的本地目录（相对项目根或绝对路径），resolve() 后做包含校验。
  # 设为 [] 表示禁止一切上传。
  api_upload_roots:
    - "fixtures"
    - "artifacts"
    - "cases"
  # api download 的落盘根目录；缺省跟随 evidence.root / MTP_ARTIFACT_ROOT。
  # 只有确需分离下载目录时才显式配置 api_download_root。
  # api 允许访问的目标主机（fnmatch 通配，只比主机名不含端口）。
  # 不配（注释掉）= 只挡云元数据/链路本地这类地址，内网被测服务照常可连；
  # 配了 = 白名单模式，不在列表内一律拒绝；配成 [] = 全部拒绝。
  # 重定向的每一跳都会重新校验。
  # api_allow_hosts:
  #   - "127.0.0.1"
  #   - "localhost"
  #   - "192.168.*"
  # 是否允许用例用 `allow_any_host: true` 自行豁免上面的白名单（默认 false）
  api_allow_any_host: false
  # 单个响应最多读多少字节（默认 5 MiB）；超限直接断开，不读完整个响应体
  api_max_response_bytes: 5242880
  # 最多跟随多少次重定向（默认 5）
  api_max_redirects: 5
  # 脱敏字段名（大小写不敏感，命中即替换为 placeholder）
  redact_keys:
    - password
    - passwd
    - pwd
    - token
    - access_token
    - refresh_token
    - cookie
    - set-cookie
    - authorization
    - secret
    - api_key
    - apikey
    - private_key
    - session
    - credential
    - credentials
  redact_placeholder: "***REDACTED***"

evidence:
  root: artifacts            # 产物/证据根目录（可用 MTP_ARTIFACT_ROOT 覆盖）
  retention_days: 14

runner:
  # 用例级会话隔离：每个用例开始前重建浏览器会话，用例之间不继承 cookie、缓存与
  # 页面状态。一次任务里所有用例共用同一个浏览器进程，不隔离的话「用例 A 登录过」
  # 会让「用例 B 的打开页面」直接落到已登录页 —— B 里那段登录/UKey 路径就没被检验，
  # 而且 B 单独跑时行为不一样。默认 true；确实要复用会话的用例可写 reuse_session: true。
  isolate_case_session: true
  # 单步超时（秒）；用例/步骤可用 timeout_sec 覆盖
  # default_step_timeout_sec: 30
  # 步骤失败最多重试几次；用例/步骤可用 retry 覆盖
  # max_retry: 5
