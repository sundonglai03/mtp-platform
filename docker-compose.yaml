# 自动化测试系统（独立部署，不与 mtp-contracts-mcp 共用 compose）
name: mtp-platform

services:
  mtp-platform:
    container_name: mtp-platform
    build: .
    image: mtp-platform:0.1.0
    working_dir: /app
    environment:
      MTP_ARTIFACT_ROOT: /app/artifacts
      # 仅用于内网部署；如需换密码，直接修改这里后重建容器。
      MTP_WEB_USERNAME: admin
      MTP_WEB_PASSWORD: "123456"
      MTP_SESSION_SECRET: mtp-platform-internal-session-secret
      MTP_MAX_CONCURRENT_RUNS: ${MTP_MAX_CONCURRENT_RUNS:-1}
      MTP_COOKIE_SECURE: "false"
    ports:
      - "${MTP_HTTP_PORT:-8080}:8080"
    volumes:
      - ./artifacts:/app/artifacts
      # 用例与配置挂进来（示例，按需调整）
      - ./tests/cases:/app/cases:ro
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
