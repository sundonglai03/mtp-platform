{% extends "base.html" %}
{% block title %}新建任务 · MTP 测试平台{% endblock %}
{% block content %}
<div class="page-heading"><div><h1>新建测试任务</h1><p class="muted">上传一个 JSON 测试套件，其中必须包含非空 <code>cases</code> 数组。</p></div></div>
<section class="card">
  <div id="form-error" class="alert error hidden"></div>
  <form id="run-form" action="/api/runs" method="post" enctype="multipart/form-data" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>JSON 测试套件<input type="file" name="suite" accept="application/json,.json" required></label>
    <label class="check danger"><input type="checkbox" name="allow_write" value="true"> 允许 MySQL 写操作</label>
    <p class="warning">开启写操作可能修改目标数据库。仅在确认用例和目标环境安全时启用。</p>
    <button type="submit">上传并开始测试</button>
  </form>
</section>
{% endblock %}
{% block scripts %}<script src="/static/app.js" defer></script>{% endblock %}
