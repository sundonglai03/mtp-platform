[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtp-platform"
version = "0.1.0"
description = "自动化测试系统：接收规范用例，直连工具执行并生成报告"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mtp-contracts-core==0.1.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "jsonpath-ng>=1.6",
    "requests>=2.31",          # http 直连工具
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2",
]

# 直连工具的重依赖按工具拆成独立 extra
[project.optional-dependencies]
ssh = ["paramiko>=3.4"]
mysql = ["PyMySQL>=1.1"]
playwright = ["playwright>=1.40"]
office = ["openpyxl>=3.1", "python-docx>=1.1"]
dev = ["pytest>=9.0", "httpx>=0.28"]

[project.scripts]
mtp = "mtp_platform.cli:main"

[tool.uv.sources]
mtp-contracts-core = { git = "https://github.com/sundonglai03/mtp-contracts-core.git", tag = "v0.1.0" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mtp_platform = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
