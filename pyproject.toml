[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtp-platform"
version = "0.2.17"
description = "常驻 HTTP 测试服务：接收 JSON 测试套件并执行"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mtp-contracts-core==0.1.12",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "jsonpath-ng>=1.6",
    "requests>=2.31",          # http 直连工具
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2",
]

# 直连工具的重依赖按工具拆成独立 extra
[project.optional-dependencies]
ssh = ["paramiko>=3.4"]
mysql = ["PyMySQL>=1.1"]
playwright = ["playwright>=1.40"]
dev = ["pytest>=9.0", "httpx>=0.28"]

[tool.uv.sources]
# 固定到不可变 tag：v0.1.1 曾把标签挪到新提交，导致消费者锁到旧 core，不能再移动
mtp-contracts-core = { git = "https://github.com/sundonglai03/mtp-contracts-core.git", tag = "v0.1.12" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mtp_platform = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
